<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>旅行记账 · 2026 关东</title><style>
:root{--bg:#f7f5f0;--ink:#24332f;--muted:#738078;--green:#557a67;--line:#dedfd8;--paper:#fffefa;--red:#b85f4e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;line-height:1.6}header{background:#263e35;color:white;padding:28px 0}.wrap{max-width:940px;margin:auto;padding:0 22px}h1{font-size:32px;font-weight:550;margin:8px 0}h2{font-size:21px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}p{margin:7px 0}small,.muted{color:var(--muted)}nav{padding:13px 0;border-bottom:1px solid var(--line)}nav a{color:var(--green);text-decoration:none;font-weight:650}main{padding:24px 0 65px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}label{display:block;font-size:13px;font-weight:650;margin:0 0 5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d6dcd5;border-radius:9px;font:inherit;background:white;color:var(--ink)}textarea{min-height:70px}button{cursor:pointer;border:0;background:var(--green);color:white;border-radius:9px;padding:11px 16px;font:inherit;font-weight:600}button.secondary{background:#e8ede8;color:var(--ink)}button.danger{background:#f6e6e1;color:#984b3c}button:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;padding:3px 9px;background:#e9f0e9;color:#466b55;border-radius:30px;font-size:12px}.notice{font-size:13px;background:#f3f1e7;padding:12px;border-radius:9px}.person{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}.person input[type=checkbox]{width:auto}.person .amount{max-width:160px;margin-left:auto}.stat{padding:14px;background:#f2f5ef;border-radius:12px}.stat strong{display:block;font-size:23px}.entry{padding:13px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.entry .title{font-weight:650}.entry .meta{font-size:12px;color:var(--muted)}.money{font-size:19px;font-weight:650}.hidden{display:none!important}.tabs button{flex:1}.tabs .secondary{background:white;border:1px solid var(--line)}.settle{padding:12px 0;border-bottom:1px solid var(--line)}.fx{font-size:13px;color:var(--muted)}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:15px}h1{font-size:27px}}
</style></head><body><header><div class="wrap"><small style="color:#d1ded3">2026 · 冬日关东漫游</small><h1>旅行记账 / Split Bill</h1><div>syj · yt · lrq</div></div></header><nav><div class="wrap row between"><a href="tokyo_yokohama_trip_2026_shared.html">← 返回旅行行程</a><span id="mode" class="pill">本地模式</span></div></nav><main class="wrap">
<div id="cloudNotice" class="card"><div class="row between"><h3>共享账本</h3><span class="pill" id="connectionLabel">正在连接</span></div><p class="notice" id="syncText">正在连接 Supabase。无需邮箱登录，直接选择付款人即可。</p><p class="muted" style="font-size:12px">共享链接不是访问权限保护。此无登录版本仅适合不敏感的旅行消费记录；请勿填写私人地址或银行卡信息。</p><button class="secondary" id="retryCloud" type="button">重新连接</button></div>
<div class="card"><div class="row between"><div><h2>当前汇率</h2><div id="rate" class="fx">正在获取 JPY → CNY 汇率…</div></div><button class="secondary" id="refreshFx">刷新汇率</button></div><div id="fxWarning" class="muted" style="font-size:12px"></div></div>
<div class="card"><h2>新增支出</h2><form id="expenseForm"><div class="grid"><div><label>消费项目</label><input id="item" required placeholder="例如：DisneySea 午餐"></div><div><label>消费地点（可选）</label><div class="row" style="flex-wrap:nowrap"><input id="place" placeholder="手动输入地点"><button class="secondary" type="button" id="geo">定位</button></div></div><div><label>金额</label><input id="total" type="number" min="0.01" step="0.01" required placeholder="3000"></div><div><label>货币</label><select id="currency"><option value="JPY">日元 JPY</option><option value="CNY">人民币 CNY</option></select></div><div><label>谁付的钱</label><select id="payer"><option>syj</option><option>yt</option><option>lrq</option></select></div><div><label>消费类型</label><select id="split"><option value="equal">共同消费 · 均分</option><option value="custom">共同消费 · 各自金额</option><option value="personal">个人消费 · 不分账</option></select></div></div><p class="muted" style="font-size:12px">自动记录保存时的时间；如忘记记账，可修改：</p><input id="occurred" type="datetime-local" style="max-width:270px"><h3 style="margin-top:17px">参与人及分摊金额</h3><div id="participants"></div><div id="splitHint" class="muted" style="font-size:13px"></div><div style="margin-top:15px"><button type="submit">保存这笔支出</button> <span id="saveStatus" class="muted"></span></div></form></div>
<div class="card"><h2>当前未清账余额</h2><div id="balances" class="grid"></div><h3 style="margin-top:20px">建议转账</h3><div id="settlements"></div><div class="row" style="margin-top:15px"><button id="clear" class="danger">已清账 · 归档并归零</button><span class="muted" style="font-size:12px">会保留历史，开始新的结算周期</span></div></div>
<div class="card"><div class="row between"><h2>支出记录</h2><select id="filter" style="width:auto"><option value="active">未清账</option><option value="all">全部历史</option><option value="closed">已清账</option></select></div><div id="entries"></div></div>
<div class="card"><h2>历史清账记录</h2><div id="history"></div><div class="row" style="margin-top:12px"><button class="secondary" id="export">导出 JSON 备份</button></div></div>
</main><script type="module">
const PEOPLE=['syj','yt','lrq'], LS='kanto-ledger-v2';
const SUP_URL='https://txhvznvgpcppbbxoezlg.supabase.co';
const SUP_KEY='sb_publishable_VvZnF8w_XdHGwxFVvc_osw_5cMJKVOS';
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={entries:[],settlements:[]},rate=null,rateDate='',client=null,cloud=false,session=null;
try{state=JSON.parse(localStorage.getItem(LS))||state}catch{}
const persist=()=>localStorage.setItem(LS,JSON.stringify(state));
function nowLocal(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}$('occurred').value=nowLocal();
const yuan=n=>'¥'+Number(n).toFixed(2);const converted=(n,c)=>c==='JPY'?Number(n)*rate:Number(n);
async function fx(){try{let r=await fetch('https://api.frankfurter.dev/v1/latest?base=JPY&symbols=CNY',{cache:'no-store'});if(!r.ok)throw Error('API error');let j=await r.json();if(!(j.rates?.CNY>0))throw Error('No rate');rate=j.rates.CNY;rateDate=j.date;localStorage.setItem('kanto-fx',JSON.stringify({rate,rateDate}));$('fxWarning').textContent='参考市场汇率，不含银行手续费；历史未清账记录随最新汇率变化。';}catch(e){try{let c=JSON.parse(localStorage.getItem('kanto-fx'));rate=c.rate;rateDate=c.rateDate;$('fxWarning').textContent='网络不可用，正在使用上次缓存汇率（非实时）。';}catch{rate=null;$('fxWarning').textContent='汇率不可用：暂不能计算跨币种结算。请联网刷新。'}}$('rate').textContent=rate?`1 JPY = ${rate.toFixed(6)} CNY · 数据日期 ${rateDate}`:'无法获取汇率';render()}
$('refreshFx').onclick=fx;
function peopleUI(){let type=$('split').value,html=PEOPLE.map(p=>`<div class="person row"><label style="margin:0;flex:1"><input type="checkbox" data-person="${p}" ${type==='personal'?'':'checked'}> ${p}</label>${type==='custom'?`<input class="amount" type="number" min="0" step="0.01" data-share="${p}" placeholder="${p} 金额">`:''}</div>`).join('');$('participants').innerHTML=html;if(type==='personal'){$('participants').querySelector(`[data-person="${$('payer').value}"]`).checked=true;} $('participants').querySelectorAll('input').forEach(x=>x.addEventListener('input',updateHint));updateHint()}
function updateHint(){let selected=[...document.querySelectorAll('[data-person]:checked')].map(x=>x.dataset.person),type=$('split').value,total=Number($('total').value||0),sum=[...document.querySelectorAll('[data-share]')].filter(x=>selected.includes(x.dataset.share)).reduce((a,x)=>a+Number(x.value||0),0);$('splitHint').textContent=type==='equal'?`已选 ${selected.length} 人，每人 ${selected.length?(total/selected.length).toFixed(2):'—'} ${$('currency').value}`:type==='custom'?`分摊合计 ${sum.toFixed(2)} / ${total.toFixed(2)} ${$('currency').value}`:'个人消费只计入所选人的个人支出，不产生与其他人的欠款。';}
$('split').onchange=peopleUI;$('payer').onchange=()=>{if($('split').value==='personal')peopleUI()};$('total').oninput=updateHint;$('currency').onchange=updateHint;peopleUI();
$('geo').onclick=()=>{if(!navigator.geolocation){alert('浏览器不支持定位');return}navigator.geolocation.getCurrentPosition(pos=>{$('place').value=`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;alert('已填入坐标。可以手动替换为店名。')},err=>alert('未获得定位：'+err.message),{timeout:10000,enableHighAccuracy:false})};
function makeShares(){let selected=[...document.querySelectorAll('[data-person]:checked')].map(x=>x.dataset.person),type=$('split').value,total=Number($('total').value);if(!selected.length)throw Error('至少选择一位参与人');if(type==='personal'&&selected.length!==1)throw Error('个人消费只能选择一位参与人');let shares={};PEOPLE.forEach(p=>shares[p]=0);if(type==='custom'){selected.forEach(p=>shares[p]=Number(document.querySelector(`[data-share="${p}"]`).value||0));if(Math.abs(Object.values(shares).reduce((a,b)=>a+b,0)-total)>0.011)throw Error('各自金额相加必须等于总金额')}else{selected.forEach((p,i)=>shares[p]=i===selected.length-1?+(total*(1-(selected.length-1)/selected.length)).toFixed(8):+(total/selected.length).toFixed(8))}return shares}
async function cloudInit(){
 try{
  let mod=await import('https://esm.sh/@supabase/supabase-js@2');
  client=mod.createClient(SUP_URL,SUP_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  await loadCloud();
 }catch(e){cloud=false;modeUI();$('syncText').textContent='云端连接失败：'+e.message+'。请先执行配套 SQL 并检查网络。';}
}
function modeUI(){
 $('mode').textContent=cloud?'云端共享':'未连接';
 $('connectionLabel').textContent=cloud?'已连接':'未连接';
 $('syncText').textContent=cloud?'三人共享账本已连接。无需登录，选择 syj、yt 或 lrq 即可记账。':'未连接云端。为避免出现各自不同步的账本，已暂停新增与清账。';
 $('expenseForm').querySelector('button[type=submit]').disabled=!cloud;
 $('clear').disabled=!cloud;
}
async function loadCloud(){
 let a=await client.from('trip_entries').select('*').order('created_at',{ascending:true}),b=await client.from('trip_settlements').select('*').order('created_at',{ascending:true});
 if(a.error||b.error){cloud=false;modeUI();$('syncText').textContent='云端读取失败：'+(a.error?.message||b.error?.message)+'。请确认已执行新版 SQL，并允许 anon 角色访问。';return}
 state={entries:a.data.map(x=>({id:x.id,...x.payload})),settlements:b.data.map(x=>({id:x.id,...x.payload}))};cloud=true;modeUI();render();
}
$('retryCloud').onclick=cloudInit;
async function addEntry(obj){if(!cloud)throw Error('尚未连接云端，不能保存');if(cloud){let {error}=await client.from('trip_entries').insert({payload:obj});if(error)throw Error(error.message);await loadCloud()}else{state.entries.push({id:crypto.randomUUID(),...obj});persist();render()}}
$('expenseForm').onsubmit=async e=>{e.preventDefault();try{let shares=makeShares(),total=Number($('total').value),obj={title:$('item').value.trim(),place:$('place').value.trim(),amount:total,currency:$('currency').value,payer:$('payer').value,shares,kind:$('split').value,occurred_at:new Date($('occurred').value).toISOString(),created_at:new Date().toISOString(),closed_id:null};if(!obj.title)throw Error('请输入消费项目');$('saveStatus').textContent='保存中…';await addEntry(obj);$('item').value='';$('place').value='';$('total').value='';$('occurred').value=nowLocal();peopleUI();$('saveStatus').textContent='已保存';}catch(err){$('saveStatus').textContent='';alert(err.message)}};
function calc(){let balances=Object.fromEntries(PEOPLE.map(p=>[p,0]));for(let e of state.entries.filter(e=>!e.closed_id)){if(rate===null&&e.currency==='JPY')return null;let amount=converted(e.amount,e.currency);balances[e.payer]+=amount;for(let p of PEOPLE)balances[p]-=converted(e.shares[p]||0,e.currency)}return balances}
function transfers(b){let debt=PEOPLE.filter(p=>b[p]<-.005).map(p=>({p,n:-b[p]})),credit=PEOPLE.filter(p=>b[p]>.005).map(p=>({p,n:b[p]})),out=[];let i=0,j=0;while(i<debt.length&&j<credit.length){let n=Math.min(debt[i].n,credit[j].n);if(n>.005)out.push({from:debt[i].p,to:credit[j].p,amount:n});debt[i].n-=n;credit[j].n-=n;if(debt[i].n<.005)i++;if(credit[j].n<.005)j++}return out}
function render(){let b=calc();$('balances').innerHTML=PEOPLE.map(p=>`<div class="stat"><small>${p}</small><strong>${b?yuan(b[p]):'待汇率'}</strong><small>${!b?'':b[p]>.005?'应收':b[p]<-.005?'应付':'已平衡'}</small></div>`).join('');let ts=b?transfers(b):[];$('settlements').innerHTML=b?(ts.length?ts.map(t=>`<div class="settle"><b>${t.from}</b> → <b>${t.to}</b>：${yuan(t.amount)} CNY</div>`).join(''):'目前没有需要转账的金额'):'需要汇率才能结算';let filter=$('filter').value,entries=state.entries.filter(e=>filter==='all'||(filter==='active'?!e.closed_id:e.closed_id)).slice().reverse();$('entries').innerHTML=entries.length?entries.map(e=>`<div class="entry"><div class="row between"><div class="title">${esc(e.title)}</div><div class="money">${e.currency==='JPY'?'¥':'¥'}${Number(e.amount).toLocaleString()} ${e.currency}</div></div><div class="meta">${esc(e.payer)} 支付 · ${new Date(e.occurred_at).toLocaleString('zh-CN')} ${e.place?'· '+esc(e.place):''} ${e.closed_id?'· 已清账':''}</div><div class="meta">分摊：${PEOPLE.filter(p=>e.shares[p]>0).map(p=>`${p} ${e.shares[p].toFixed(2)}`).join(' / ')} ${e.currency}${rate&&e.currency==='JPY'?' · 当前约 '+yuan(converted(e.amount,e.currency))+' CNY':''}</div>${!e.closed_id?`<button class="secondary" style="padding:4px 10px;font-size:12px;margin-top:6px" data-delete="${e.id}">删除记录</button>`:''}</div>`).join(''):'暂无记录';$('history').innerHTML=state.settlements.length?state.settlements.slice().reverse().map(s=>`<div class="entry"><b>${new Date(s.settled_at).toLocaleString('zh-CN')}</b><div class="meta">结算汇率：1 JPY = ${Number(s.fx_rate).toFixed(6)} CNY · ${s.count} 笔支出</div>${s.transfers.length?s.transfers.map(t=>`<div>${t.from} → ${t.to}：${yuan(t.amount)}</div>`).join(''):'本期无需转账'}</div>`).join(''):'暂无清账记录';document.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=async()=>{if(!confirm('删除这笔支出？'))return;try{if(!cloud)throw Error('云端未连接');if(cloud){let {error}=await client.from('trip_entries').delete().eq('id',btn.dataset.delete);if(error)throw Error(error.message);await loadCloud()}else{state.entries=state.entries.filter(e=>e.id!==btn.dataset.delete);persist();render()}}catch(e){alert(e.message)}})}
$('filter').onchange=render;
$('clear').onclick=async()=>{if(!cloud){alert('云端未连接');return}let b=calc();if(!b){alert('汇率不可用，不能清账');return}let active=state.entries.filter(e=>!e.closed_id);if(!active.length){alert('没有待清账支出');return}let ts=transfers(b);let msg=ts.length?ts.map(t=>`${t.from} → ${t.to}：${yuan(t.amount)} CNY`).join('\n'):'本期无需转账';if(!confirm(`请先确认以下款项已实际支付：\n${msg}\n\n确认后将归档本期支出，余额归零。`))return;let settled_at=new Date().toISOString(),snap={settled_at,fx_rate:rate,fx_date:rateDate,count:active.length,transfers:ts},id=crypto.randomUUID();try{if(cloud){let {error}=await client.rpc('trip_close_cycle',{p_snapshot:snap});if(error)throw Error(error.message);await loadCloud()}else{state.settlements.push({id,...snap});active.forEach(e=>e.closed_id=id);persist();render()}}catch(e){alert('清账未完全完成，请刷新检查：'+e.message)}};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),rate,rateDate,...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trip-ledger-backup.json';a.click();URL.revokeObjectURL(a.href)};
modeUI();render();fx();cloudInit();setInterval(()=>{if(cloud&&document.visibilityState==='visible')loadCloud()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&client)loadCloud()});
</script></body></html>
