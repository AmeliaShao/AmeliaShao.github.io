<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 台湾春节旅行景点心愿单</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif;color:#20343a;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#175d59,#328b7e);color:white;padding:32px max(18px,calc((100vw - 940px)/2))}h1{font-size:clamp(25px,5vw,38px);margin:8px 0}header p{line-height:1.7;max-width:650px}.wrap{max-width:940px;margin:auto;padding:18px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 22px;align-items:center}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #cbd8d5;background:white;border-radius:10px;padding:10px 13px;color:#24443f}button.active{background:#146b60;color:white;border-color:#146b60}button:focus-visible{outline:3px solid #e7a94e}input[type=search]{flex:1;min-width:180px;border:1px solid #cbd8d5;border-radius:10px;padding:12px;font-size:16px}.cat{margin:26px 0}.cat h2{font-size:22px;margin-bottom:5px}.cat p{color:#5c6e6b;margin-top:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:13px}.card{background:white;border:1px solid #e0e7e4;border-radius:16px;padding:17px;box-shadow:0 2px 10px #153e3510}.card h3{font-size:19px;margin:0 0 8px}.meta{font-size:13px;color:#5a716a;margin-bottom:10px}.desc{min-height:43px;line-height:1.55;font-size:15px}.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.choices button{font-size:14px;padding:9px 10px;flex:1}.choices button[data-val=skip].active{background:#65737a;border-color:#65737a}.choices button[data-val=repeat].active{background:#9a6a2e;border-color:#9a6a2e}.sticky{position:sticky;bottom:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #d9e3df;padding:12px 18px;box-shadow:0 -4px 15px #0001}.sticky>div{max-width:940px;margin:auto;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.primary{background:#146b60;color:white;border-color:#146b60}.summary{background:white;border-radius:16px;padding:20px;margin:24px 0;border:1px solid #d9e3df}.summary textarea{width:100%;min-height:180px;padding:12px;border:1px solid #cbd8d5;border-radius:10px;font-size:15px}small{color:#687a76}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:12px}.cards{grid-template-columns:1fr}.sticky button{padding:10px 9px}.desc{min-height:0}}</style></head><body><header><div style="font-size:14px;opacity:.9">台南出发 · 春节初一至初七 · 2027.02.06–02.12</div><h1 id="title">台湾春节旅行 · 景点心愿单</h1><p id="intro">爸妈可以慢慢看看，喜欢的选「想去」，去过还想再去的选「想重游」。选好后点底部的「分享结果」，发给家人即可。选择会自动保存在这台设备上。</p></header><main class="wrap"><div class="toolbar"><input id="search" type="search" placeholder="搜索景点、地区或特色…"><button id="lang" onclick="toggleLang()">繁體中文</button><button onclick="setFilter('all')" id="f-all" class="active">全部</button><button onclick="setFilter('want')" id="f-want">想去</button><button onclick="setFilter('repeat')" id="f-repeat">想重游</button><button onclick="setFilter('unset')" id="f-unset">未选择</button></div><div id="content"></div><section class="summary" id="summary"><h2>我的选择</h2><p id="counts"></p><textarea id="result" readonly></textarea><div class="toolbar"><button class="primary" onclick="share()">分享结果</button><button onclick="copyResult()">复制文字</button><button onclick="downloadResult()">保存为文本</button><button onclick="resetAll()">清空选择</button></div><small>提示：没有数据库，结果不会自动发给家人。请使用「分享结果」或「复制文字」发送。若更换设备，原选择不会同步。</small></section></main><div class="sticky"><div><strong id="progress">已选择 0 项</strong><button class="primary" onclick="document.getElementById('summary').scrollIntoView({behavior:'smooth'})">查看并分享结果 ↑</button></div></div><script>
const groups=[

['温泉休闲','适合放慢节奏或外宿一晚。',[
['关子岭泥浆温泉','台南','泥浆温泉与山林','半天–1晚','高'],['四重溪温泉','屏东','温泉与南部山城','1–2天','中'],['宝来温泉','高雄','山区温泉与溪谷','1–2天','中'],['不老温泉','高雄','六龟山区泡汤','1–2天','中'],['石棹茶园民宿','嘉义','茶园住宿、品茶与观云海','1晚','中']]],

['七股潟湖生态船游','台南','搭船看潟湖与沙洲','半天','中'],['美浓油纸伞手作','高雄','传统客家工艺','1–2小时','中'],['阿里山茶席体验','嘉义','品茶与茶文化','1–2小时','中'],['黑面琵鹭生态导览','台南','专业观鸟解说','2–3小时','中'],['台南传统市场美食巡游','台南','早餐与市场文化','半天','中'],['东山咖啡庄园体验','台南','台湾咖啡种植与品鉴','半天','低'],['盐田晒盐体验','台南','传统制盐文化','1–2小时','中'],['阿里山森林铁路体验','嘉义','山区铁路与森林风景','半天','高']]]];
const items=groups.flatMap((g,gi)=>g[2].map((it,ii)=>({id:gi+'-'+ii,group:gi,name:it[0],area:it[1],desc:it[2],duration:it[3],crowd:it[4]})));
let selections={};try{selections=JSON.parse(localStorage.getItem('taiwan-2027-choices')||'{}')}catch(e){}let filter='all',traditional=false;
const labels=()=>traditional?['想去','去過想重遊','不考慮']:['想去','去过想重游','不考虑'];
function zh(s){if(!traditional)return s;const dict={'台湾':'臺灣','台南':'臺南','台北':'臺北','台':'臺','湾':'灣','盐':'鹽','观':'觀','园':'園','区':'區','东':'東','乡':'鄉','龙':'龍','马':'馬','门':'門','关':'關','云':'雲','铁':'鐵','历':'歷','艺':'藝','术':'術','鱼':'魚','岛':'島','旧':'舊','书':'書','乐':'樂','国':'國','风':'風','车':'車','庙':'廟','馆':'館','丽':'麗','体':'體','验':'驗','与':'與','发':'發','过':'過','还':'還','来':'來','选':'選','择':'擇','经':'經','热':'熱','点':'點','线':'線','间':'間','间':'間','时':'時','长':'長','亲':'親','简':'簡','绍':'紹','历':'歷','桥':'橋','户':'戶','湾':'灣','湾':'灣','峡':'峽','处':'處','边':'邊','滨':'濱','书':'書','铁':'鐵','众':'眾','义':'義','兴':'興','乡':'鄉','农':'農','鸟':'鳥','岛':'島','庙':'廟','汤':'湯','步':'步','鱼':'魚','鲜':'鮮','阴':'陰','宫':'宮','圣':'聖','务':'務','阳':'陽','学':'學','盐':'鹽','灯':'燈','节':'節','线':'線','从':'從','属':'屬','对':'對','应':'應','览':'覽','导':'導','览':'覽','岛':'島','县':'縣','馆':'館','张':'張','与':'與','术':'術','峡':'峽','绘':'繪','湾':'灣','间':'間','际':'際','气':'氣','别':'別','拥':'擁','挤':'擠','静':'靜','护':'護','时':'時','间':'間','开':'開','闭':'閉','备':'備','注':'註','专':'專','业':'業','统':'統','传':'傳','动':'動','车':'車','复':'複','复':'復','买':'買','卖':'賣','类':'類','级':'級','数':'數','记':'記','录':'錄','变':'變','计':'計','划':'劃','风':'風','景':'景','杂':'雜','仅':'僅','单':'單','纯':'純','钟':'鐘','岛':'島','丛':'叢','林':'林','经':'經','后':'後','无':'無','简':'簡','体':'體','语':'語','换':'換','储':'儲','存':'存','设':'設','备':'備','发':'發','给':'給','结':'結','果':'果','览':'覽','阅':'閱','项':'項','汇':'匯','总':'總','条':'條','闻':'聞','别':'別','处':'處','联':'聯','络':'絡','络':'絡','台':'臺','湾':'灣'};return [...s].map(c=>dict[c]||c).join('')}
function setChoice(id,v){selections[id]=selections[id]===v?undefined:v;localStorage.setItem('taiwan-2027-choices',JSON.stringify(selections));render()}
function setFilter(f){filter=f;render()}
function toggleLang(){traditional=!traditional;render()}
function resultText(){let a=['2027 台湾春节旅行景点选择'];for(const [v,label] of [['want','想去'],['repeat','去过想重游'],['skip','不考虑']]){const selected=items.filter(it=>selections[it.id]===v);a.push('\n'+label+'（'+selected.length+'）：');a.push(selected.length?selected.map(it=>'• '+it.name+'（'+it.area+'）').join('\n'):'暂无')}return zh(a.join('\n'))}
function render(){document.documentElement.lang=traditional?'zh-TW':'zh-CN';document.getElementById('title').textContent=zh('台湾春节旅行 · 景点心愿单');document.getElementById('intro').textContent=zh('爸妈可以慢慢看看，喜欢的选「想去」，去过还想再去的选「想重游」。选好后点底部的「分享结果」，发给家人即可。选择会自动保存在这台设备上。');document.getElementById('lang').textContent=traditional?'简体中文':'繁體中文';document.getElementById('search').placeholder=zh('搜索景点、地区或特色…');for(const f of ['all','want','repeat','unset']){const el=document.getElementById('f-'+f);el.classList.toggle('active',f===filter);el.textContent=zh(({all:'全部',want:'想去',repeat:'想重游',unset:'未选择'})[f])}const q=document.getElementById('search').value.toLowerCase();const root=document.getElementById('content');root.replaceChildren();groups.forEach((g,gi)=>{const matches=items.filter(it=>it.group===gi&&(!q||(it.name+it.area+it.desc).toLowerCase().includes(q))&&(filter==='all'||(filter==='unset'?!selections[it.id]:selections[it.id]===filter)));if(!matches.length)return;const section=document.createElement('section');section.className='cat';const h=document.createElement('h2');h.textContent=zh(g[0])+' · '+matches.length;const p=document.createElement('p');p.textContent=zh(g[1]);const cards=document.createElement('div');cards.className='cards';matches.forEach(it=>{const card=document.createElement('article');card.className='card';const name=document.createElement('h3');name.textContent=zh(it.name);const meta=document.createElement('div');meta.className='meta';meta.textContent=zh(it.area+' · '+it.duration+' · 春节人潮预估：'+it.crowd);const desc=document.createElement('div');desc.className='desc';desc.textContent=zh(it.desc);const choices=document.createElement('div');choices.className='choices';choices.setAttribute('aria-label',zh(it.name+'选择'));['want','repeat','skip'].forEach((v,i)=>{const b=document.createElement('button');b.dataset.val=v;b.className=selections[it.id]===v?'active':'';b.textContent=zh(labels()[i]);b.setAttribute('aria-pressed',selections[it.id]===v?'true':'false');b.onclick=()=>setChoice(it.id,v);choices.append(b)});card.append(name,meta,desc,choices);cards.append(card)});section.append(h,p,cards);root.append(section)});if(!root.children.length)root.textContent=zh('没有符合条件的景点。');const n=Object.values(selections).filter(Boolean).length;document.getElementById('progress').textContent=zh('已选择 '+n+' / '+items.length+' 项');document.getElementById('counts').textContent=zh('想去 '+items.filter(x=>selections[x.id]==='want').length+' · 想重游 '+items.filter(x=>selections[x.id]==='repeat').length+' · 不考虑 '+items.filter(x=>selections[x.id]==='skip').length);document.getElementById('result').value=resultText();document.querySelector('#summary h2').textContent=zh('我的选择');document.querySelector('.sticky button').textContent=zh('查看并分享结果 ↑');const btns=document.querySelectorAll('#summary .toolbar button');['分享结果','复制文字','保存为文本','清空选择'].forEach((s,i)=>btns[i].textContent=zh(s));document.querySelector('#summary small').textContent=zh('提示：没有数据库，结果不会自动发给家人。请使用「分享结果」或「复制文字」发送。若更换设备，原选择不会同步。')}
async function copyResult(){try{await navigator.clipboard.writeText(resultText());alert(zh('已复制，可以粘贴到微信或 WhatsApp。'))}catch(e){document.getElementById('result').select();document.execCommand('copy');alert(zh('请检查是否已复制，或手动选择文本复制。'))}}
async function share(){if(navigator.share){try{await navigator.share({title:'台湾春节旅行景点选择',text:resultText()})}catch(e){if(e.name!=='AbortError')copyResult()}}else copyResult()}
function downloadResult(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([resultText()],{type:'text/plain;charset=utf-8'}));a.download='台湾春节景点选择.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetAll(){if(confirm(zh('确定清空全部选择吗？'))){selections={};localStorage.removeItem('taiwan-2027-choices');render()}}
document.getElementById('search').addEventListener('input',render);render();
