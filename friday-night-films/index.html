<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Friday Night Films</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap' rel='stylesheet'><link rel='stylesheet' href='style.css'></head><body>
<header><div class='mark'>FNF / 002</div><h1>Friday Night<br><em>Films</em></h1><p>movies are better with friends</p><div class='date' id='date'></div></header>
<main><section><div class='section-head'><h2>This week's picks</h2><button id='open'>+ Suggest a movie</button></div><div id='movies' class='grid'></div></section><section class='past'><div class='section-head'><h2>Previous nights</h2></div><p class='muted'>Our little archive will appear here after the first movie night.</p></section></main>
<dialog id='modal'><form id='form'><button type='button' id='close' class='x'>×</button><p class='eyebrow'>ADD TO THE BALLOT</p><h2>What should we watch?</h2><label>Search movie<div class='search-row'><input autocomplete='off' id='movieSearch' placeholder='e.g. Chungking Express'><button type='button' id='searchBtn' class='search-btn'>Search</button></div></label><div id='searchStatus' class='search-status'></div><div id='results' class='results'></div><input type='hidden' name='tmdb_id'><input type='hidden' name='title'><input type='hidden' name='year'><input type='hidden' name='poster'><input type='hidden' name='genre'><label>Your name<input required name='name' placeholder='e.g. Amelia'></label><label>Why this one?<textarea required name='reason' maxlength='140' placeholder='Sell it to the group in one sentence...'></textarea></label><button class='submit'>Add movie →</button><p class='tiny'>Posters and movie metadata via TMDB. Movie cards open a Douban movie search.</p></form></dialog>
<script src='config.js?v=15'></script><script src='app.js?v=15'></script></body></html>
