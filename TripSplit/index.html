<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TripSplit Lite</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{background:#fff;border-bottom:1px solid #e5eaf2;position:sticky;top:0;z-index:5}.bar{max-width:880px;margin:auto;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:850;color:#2466da}.sub{color:#748198;font-size:12px}.container{max-width:880px;margin:24px auto;padding:0 16px 70px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #1d396008}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted{color:#738199}.small{font-size:13px}.title{font-size:25px;margin:5px 0 12px}.btn{background:#2466da;color:#fff;padding:11px 16px;border-radius:11px;font-weight:650}.btn.alt{background:#eaf1ff;color:#245bc4}.btn.ghost{background:#f2f5f9;color:#42526b}.btn.danger{background:#fff0f0;color:#b62c35}.btn:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dce3ed;border-radius:10px;background:#fff;color:#18243a}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}textarea{min-height:70px;resize:vertical}.pill{border-radius:99px;background:#eff5ff;color:#2466da;padding:5px 9px;font-size:12px}.item{padding:14px 0;border-bottom:1px solid #edf0f5}.item:last-child{border:0}.amount{font-weight:750;font-variant-numeric:tabular-nums}.positive{color:#14835a}.negative{color:#c14c3b}.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;background:#f2f5f9;border-radius:9px;margin:4px 5px 4px 0;font-size:13px}.chip input{width:auto}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0}.tabs button{white-space:nowrap;background:#edf2f8;color:#52617a;padding:10px 13px;border-radius:10px}.tabs button.active{background:#2466da;color:white}.notice{padding:12px;border-radius:12px;background:#fff7e7;color:#855b19;font-size:13px;line-height:1.5}.empty{padding:25px;text-align:center;color:#8190a4}.mini{font-size:12px;padding:7px 9px}.hero{background:linear-gradient(130deg,#2466da,#6b9bf0);color:#fff;border-radius:18px;padding:24px;margin:14px 0}.hero .muted{color:#e2ebff}.hero .btn{background:white;color:#245bc4}dialog{border:0;border-radius:18px;padding:0;width:min(95vw,540px);max-height:90vh;box-shadow:0 20px 90px #142b4750}dialog::backdrop{background:#15274488}.modal{padding:22px;overflow:auto;max-height:90vh}.modal h2{margin-top:0}.splitline{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin:7px 0}@media(max-width:560px){.grid{grid-template-columns:1fr}.container{margin-top:12px}.card{padding:16px}.title{font-size:22px}}
</style></head><body><header><div class="bar"><div><div class="brand">✈ TripSplit <span class="sub">Lite</span></div><div class="sub">一起旅行，轻松分账</div></div><div id="identity" class="small muted"></div></div></header><main class="container" id="app"></main><dialog id="modal"><div class="modal" id="modalBody"></div></dialog><script>
'use strict';
const KEY='tripsplit_cloud_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{name:'',rooms:[],active:null}}catch{state={name:'',rooms:[],active:null}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const money=(n,c)=>`${c} ${Number(n||0).toFixed(2)}`;const save=async()=>{localStorage.setItem(KEY,JSON.stringify(state));render();if(state.active){let r=room(),meta=cloudMeta[r.id];if(!meta)return;try{let result=await rpc('trip_save',{p_code:meta.code,p_username:state.name,p_version:meta.version,p_data:r});meta.version=result.version;localStorage.setItem(KEY,JSON.stringify(state));}catch(e){alert('云端保存失败：'+e.message+'。将重新加载最新房间数据，请重试操作。');await enter(r.id);}}};const room=()=>state.rooms.find(r=>r.id===state.active);const today=()=>new Date().toISOString().slice(0,10);const n=v=>Number(v)||0;const round=v=>Math.round((v+Number.EPSILON)*100)/100;
const SUPABASE_URL='https://glccdpdiawhmktczaohq.supabase.co';
const SUPABASE_KEY='sb_publishable_NPkP0as474jfOXuzqzGQ4w_PuxkjwUi';
let cloudMeta={},roomSummaries=[];
async function rpc(name,body){let res=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await res.json().catch(()=>null);if(!res.ok)throw Error(data?.message||'网络错误 '+res.status);return data;}
async function refreshRooms(){roomSummaries=await rpc('trip_list',{p_username:state.name});for(let x of roomSummaries)cloudMeta[x.id]={code:x.code,version:x.version};render();}
async function joinRoom(){let code=prompt('输入朋友分享的房间邀请码（12 位字母数字）');if(!code)return;try{let x=await rpc('trip_join',{p_code:code,p_username:state.name});cloudMeta[x.room.id]={code:x.code,version:x.version};state.rooms=state.rooms.filter(r=>r.id!==x.room.id).concat(x.room);state.active=x.room.id;localStorage.setItem(KEY,JSON.stringify(state));render();}catch(e){alert('加入失败：'+e.message)}}
function openModal(html){$('modalBody').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function log(r,txt){r.logs.unshift({id:uid(),at:new Date().toLocaleString('zh-CN'),text:txt});}function personOptions(r,selected){return r.members.map(m=>`<option value="${esc(m.id)}" ${m.id===selected?'selected':''}>${esc(m.name)}</option>`).join('')}
function render(){ $('identity').textContent=state.name?`👤 ${state.name}`:'';if(!state.name){$('app').innerHTML=`<div class="hero"><h1>旅行花销，不再算不清</h1><p>无需注册，输入昵称即可开始。</p></div><div class="card"><h2>欢迎使用 TripSplit</h2><label>你的昵称</label><input id="nickname" maxlength="30" placeholder="例如：Amelia"><p class="notice">无需密码的熟人共享模式：知道你的昵称的人可能冒用你的身份。请勿保存敏感信息。</p><button class="btn" onclick="start()">开始使用 →</button></div>`;return}let r=room();if(!r){renderHome();return}renderRoom(r)}
async function start(){let v=$('nickname').value.trim();if(!v)return alert('请输入昵称');state.name=v;state.rooms=[];state.active=null;localStorage.setItem(KEY,JSON.stringify(state));try{await refreshRooms()}catch(e){alert('连接云端失败：请先在 Supabase 执行 setup.sql。'+e.message);render()}}
function renderHome(){$('app').innerHTML=`<div class="row"><div><div class="muted small">欢迎回来，${esc(state.name)}</div><h1 class="title">我的旅行</h1></div><button class="btn" onclick="createRoom()">＋ 创建旅行</button></div><div class="actions"><button class="btn alt" onclick="joinRoom()">🔑 输入邀请码加入房间</button><button class="btn ghost" onclick="refreshRooms().catch(e=>alert(e.message))">↻ 刷新房间</button><button class="btn ghost" onclick="switchUser()">切换用户名</button></div><p class="notice">云端共享版 · 同名用户可查看同名成员加入的房间。没有密码保护，请只与信任的朋友使用。</p>${roomSummaries.length?`<div class="grid">${roomSummaries.map(r=>`<div class="card"><div class="row"><strong>${esc(r.name)}</strong><span class="pill">${r.archived?'已归档':'进行中'}</span></div><p class="muted small">邀请码：<strong>${esc(r.code)}</strong></p><button class="btn alt" onclick="enter('${r.id}')">进入房间 →</button></div>`).join('')}</div>`:'<div class="card empty">还没有房间。创建旅行，或输入朋友的邀请码加入。</div>'}`}
function switchUser(){if(!confirm('切换用户名？当前浏览器会记住新用户名。'))return;state={name:'',rooms:[],active:null};roomSummaries=[];localStorage.setItem(KEY,JSON.stringify(state));render()}
function createRoom(){openModal(`<h2>创建旅行房间</h2><label>旅行名称</label><input id="roomName" placeholder="例如：东京 7 日游"><label>结算基准币种</label><select id="baseCurrency">${['JPY','CNY','SGD','TWD','KRW','USD','EUR','THB','MYR','HKD'].map(c=>`<option ${c==='JPY'?'selected':''}>${c}</option>`).join('')}</select><p class="muted small">以后可以添加其他消费币种和手动汇率。</p><div class="actions"><button class="btn" onclick="confirmRoom()">创建房间</button><button class="btn ghost" onclick="closeModal()">取消</button></div>`)}
async function confirmRoom(){let name=$('roomName').value.trim(),base=$('baseCurrency').value;if(!name)return alert('请填写旅行名称');try{let x=await rpc('trip_create',{p_name:name,p_base:base,p_username:state.name});cloudMeta[x.room.id]={code:x.code,version:x.version};state.rooms.push(x.room);state.active=x.room.id;closeModal();localStorage.setItem(KEY,JSON.stringify(state));render();}catch(e){alert('创建失败：'+e.message)}}
async function enter(id){let meta=cloudMeta[id];if(!meta)return alert('找不到房间邀请码，请刷新首页');try{let x=await rpc('trip_load',{p_code:meta.code});if(!x)return alert('房间不存在');cloudMeta[id]={code:x.code,version:x.version};state.rooms=state.rooms.filter(r=>r.id!==id).concat(x.room);state.active=id;localStorage.setItem(KEY,JSON.stringify(state));render();}catch(e){alert('读取房间失败：'+e.message)}}
async function home(){state.active=null;localStorage.setItem(KEY,JSON.stringify(state));try{await refreshRooms()}catch(e){alert(e.message);render()}}
function balance(r){let out=Object.fromEntries(r.members.map(m=>[m.id,0]));for(let e of r.expenses){let v=round(e.amount*e.rate);out[e.payer]=(out[e.payer]||0)+v;for(let s of e.splits)out[s.member]=(out[s.member]||0)-round(s.amount*e.rate)}for(let s of r.settlements){out[s.from]=(out[s.from]||0)+s.amount;out[s.to]=(out[s.to]||0)-s.amount}return out}
function transfers(r){let b=balance(r),deb=[],cred=[];for(let m of r.members){let cents=Math.round(b[m.id]*100);if(cents<0)deb.push({m,cents:-cents});if(cents>0)cred.push({m,cents})}let arr=[],i=0,j=0;while(i<deb.length&&j<cred.length){let v=Math.min(deb[i].cents,cred[j].cents);if(v>0)arr.push({from:deb[i].m.name,to:cred[j].m.name,amount:v/100});deb[i].cents-=v;cred[j].cents-=v;if(!deb[i].cents)i++;if(!cred[j].cents)j++}return arr}
const CATEGORIES=['吃喝','住宿','交通','门票','纪念品','购物','其他'];
let personalFilter='all';
function renderPersonal(c,r){
 const member=r.members.find(m=>m.name===state.name);
 if(!member){c.innerHTML='<div class="card notice">当前用户名不在此房间的成员列表中，无法匹配个人总账。</div>';return;}
 const mid=member.id, entries=r.expenses.map(e=>{
  const share=(e.splits||[]).filter(s=>s.member===mid).reduce((v,s)=>v+round(Number(s.amount)*Number(e.rate)),0);
  return {e,share:round(share),paid:e.payer===mid};
 }).filter(x=>x.share>0||x.paid);
 const spent=round(entries.reduce((a,x)=>a+x.share,0));
 const paid=round(entries.reduce((a,x)=>a+(x.paid?round(x.e.amount*x.e.rate):0),0));
 const net=round(balance(r)[mid]||0);
 const grouped=Object.fromEntries(CATEGORIES.map(x=>[x,0]));
 entries.forEach(x=>{const k=CATEGORIES.includes(x.e.category)?x.e.category:'其他';grouped[k]=round(grouped[k]+x.share)});
 const visible=entries.filter(x=>personalFilter==='all'||(personalFilter==='paid'?x.paid:!x.paid));
 c.innerHTML=`<h2>我的总账 · ${esc(member.name)}</h2><div class="card"><div class="muted small">我的实际消费（应承担）</div><h1 style="margin:7px 0">${money(spent,r.base)}</h1><div class="grid"><div><div class="muted small">我已垫付</div><strong>${money(paid,r.base)}</strong></div><div><div class="muted small">我的净余额（含还款）</div><strong class="${net>=0?'positive':'negative'}">${net>0?'+':''}${money(net,r.base)}</strong></div></div><p class="muted small">正数为待收回，负数为待支付；实际消费不受还款影响。</p></div><h2>消费类别统计</h2><div class="card">${CATEGORIES.filter(k=>grouped[k]>0).length?CATEGORIES.filter(k=>grouped[k]>0).map(k=>`<div class="item"><div class="row"><strong>${k}</strong><span>${money(grouped[k],r.base)} · ${spent>0?(grouped[k]/spent*100).toFixed(1):'0.0'}%</span></div><div style="height:7px;background:#edf2f8;border-radius:8px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${spent>0?Math.min(100,grouped[k]/spent*100):0}%;background:#2466da;border-radius:8px"></div></div></div>`).join(''):'<div class="empty">暂无个人消费</div>'}</div><div class="row"><h2>我的消费明细</h2><button class="btn alt mini" onclick="exportPersonalCsv()">导出个人 CSV</button></div><div class="tabs">${[['all','全部相关'],['paid','我付款的'],['others','别人代付的']].map(([k,v])=>`<button class="${personalFilter===k?'active':''}" onclick="personalFilter='${k}';render()">${v}</button>`).join('')}</div><div class="card">${visible.length?visible.slice().reverse().map(x=>`<div class="item row"><div><strong>${esc(x.e.title)}</strong> <span class="pill">${esc(x.e.category||'其他')}</span><div class="small muted">${esc(x.e.date)} · ${x.paid?'我付款':'朋友付款'} · 原价 ${money(x.e.amount,x.e.currency)}</div></div><div style="text-align:right"><div class="amount">${money(x.share,r.base)}</div><div class="small muted">我的分摊</div></div></div>`).join(''):'<div class="empty">暂无符合条件的消费</div>'}</div>`;
}
function exportPersonalCsv(){const r=room(),m=r.members.find(x=>x.name===state.name);if(!m)return alert('无法匹配当前成员');const rows=[['日期','消费','类别','付款方式','原始金额','原始币种','我的分摊（'+r.base+'）'],...r.expenses.map(e=>({e,share:round((e.splits||[]).filter(s=>s.member===m.id).reduce((a,s)=>a+round(s.amount*e.rate),0))})).filter(x=>x.share>0||x.e.payer===m.id).map(x=>[x.e.date,x.e.title,x.e.category||'其他',x.e.payer===m.id?'我付款':'朋友付款',x.e.amount,x.e.currency,x.share])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('tripsplit-personal-'+r.name.replace(/[^\w\u4e00-\u9fa5-]/g,'_')+'.csv',csv,'text/csv;charset=utf-8')}
let tab='expenses';function setTab(t){tab=t;render();if(t==='settings')updateConversion()}
function renderRoom(r){let total=r.expenses.reduce((s,e)=>s+round(e.amount*e.rate),0),b=balance(r);$('app').innerHTML=`<div class="row"><button class="btn ghost mini" onclick="home()">← 我的旅行</button><span class="pill">${r.archived?'已归档 · 只读':'进行中'}</span></div><div class="hero"><div class="muted small">${esc(r.name)}</div><h1 style="margin:7px 0">${money(total,r.base)}</h1><div class="muted small">总支出 · ${r.members.length} 位成员 · ${r.expenses.length} 笔消费</div><div class="small" style="margin-top:8px">🔑 房间邀请码：<strong>${esc(cloudMeta[r.id]?.code||'')}</strong> <button class="btn ghost mini" onclick="navigator.clipboard?.writeText(cloudMeta[room().id].code).then(()=>alert('邀请码已复制'))">复制</button> <button class="btn ghost mini" onclick="enter('${r.id}')">↻ 同步</button></div></div><div class="tabs">${[['expenses','账目'],['personal','我的总账'],['balances','结算'],['members','成员'],['settings','设置'],['history','操作历史']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div><div id="tabContent"></div>`;let c=$('tabContent');if(tab==='expenses'){c.innerHTML=`<div class="row" style="margin-top:15px"><h2>消费记录</h2>${r.archived?'':`<button class="btn" onclick="editExpense()">＋ 添加消费</button>`}</div>${r.expenses.length?`<div class="card">${[...r.expenses].reverse().map(e=>`<div class="item row"><div><strong>${esc(e.title)}</strong> <span class="pill">${esc(e.category||'其他')}</span><div class="small muted">${esc(e.date)} · ${esc(r.members.find(m=>m.id===e.payer)?.name||'原成员')} 付款 · ${e.splits.length} 人分摊</div><div class="small muted">折合 ${money(round(e.amount*e.rate),r.base)}</div></div><div style="text-align:right"><div class="amount">${money(e.amount,e.currency)}</div>${r.archived?'':`<div class="actions" style="margin-top:7px"><button class="btn ghost mini" onclick="editExpense('${e.id}')">编辑</button><button class="btn danger mini" onclick="deleteExpense('${e.id}')">删除</button></div>`}</div></div>`).join('')}</div>`:'<div class="card empty">暂无账目，添加第一笔消费吧。</div>'}`}
else if(tab==='personal'){renderPersonal(c,r)}
 else if(tab==='balances'){c.innerHTML=`<h2>成员余额</h2><div class="card">${r.members.map(m=>`<div class="item row"><strong>${esc(m.name)}</strong><span class="amount ${b[m.id]>=0?'positive':'negative'}">${b[m.id]>0?'+':''}${money(round(b[m.id]),r.base)}</span></div>`).join('')}<p class="muted small">正数代表应收，负数代表应付。已扣除登记过的还款。</p></div><h2>建议转账</h2><div class="card">${transfers(r).length?transfers(r).map(t=>`<div class="item row"><span>${esc(t.from)} → ${esc(t.to)}</span><strong>${money(t.amount,r.base)}</strong></div>`).join(''):'<div class="empty">当前没有待结算余额 🎉</div>'}</div><div class="row"><h2>实际还款</h2>${r.archived?'':`<button class="btn" onclick="addSettlement()">＋ 记录还款</button>`}</div><div class="card">${r.settlements.length?r.settlements.map(s=>`<div class="item row"><div><strong>${esc(r.members.find(m=>m.id===s.from)?.name||'原成员')} → ${esc(r.members.find(m=>m.id===s.to)?.name||'原成员')}</strong><div class="muted small">${esc(s.date)}</div></div><div><strong>${money(s.amount,r.base)}</strong>${r.archived?'':` <button class="btn danger mini" onclick="deleteSettlement('${s.id}')">撤销</button>`}</div></div>`).join(''):'<div class="empty">暂无还款记录</div>'}</div>`}
else if(tab==='members'){c.innerHTML=`<div class="row"><h2>房间成员</h2>${r.archived?'':`<button class="btn" onclick="alert('请让朋友输入邀请码自行加入房间')">邀请成员</button>`}</div><div class="card">${r.members.map((m,i)=>`<div class="item row"><strong>👤 ${esc(m.name)} ${i===0?'<span class="pill">创建者</span>':''}</strong><span class="muted small">${esc(m.name===state.name?'当前用户名':'房间成员')}</span></div>`).join('')}</div><p class="notice">请将房间邀请码分享给朋友，对方输入自己的昵称和邀请码即可加入。</p>`}
else if(tab==='settings'){c.innerHTML=`<h2>房间设置</h2><div class="card"><label>房间名称</label><input id="rename" value="${esc(r.name)}" ${r.archived?'disabled':''}><label>结算币种</label><input value="${esc(r.base)}" disabled><p class="muted small">基准币种创建后不可更改，避免历史账目错算。</p>${r.archived?'':`<button class="btn alt" onclick="renameRoom()">保存名称</button>`}<h3>手动汇率与换算</h3><p class="muted small">每 1 单位消费币种 = 多少 ${esc(r.base)}。已保存账目的汇率不会随设置变化。</p>${Object.entries(r.rates).map(([c,v])=>`<div class="item row"><span>1 ${esc(c)} = ${v} ${esc(r.base)} ${c===r.base?'<span class="pill">基准币种</span>':''}</span>${!r.archived&&c!==r.base?`<div class="actions"><button class="btn ghost mini" onclick="editRate('${c}')">修改</button><button class="btn danger mini" onclick="deleteRate('${c}')">删除</button></div>`:''}</div>`).join('')}${r.archived?'':`<div class="grid"><div><label>消费币种</label><input id="newCurrency" maxlength="3" placeholder="例如 CNY"></div><div><label>对应汇率</label><input id="newRate" type="number" step="any" min="0" placeholder="例如 20"></div></div><button class="btn alt" onclick="addRate()">保存汇率</button>`}<div style="margin-top:16px;padding:14px;border-radius:12px;background:#f2f6ff"><strong>快速汇率换算</strong><div class="grid"><div><label>原始金额</label><input id="convertAmount" type="number" min="0" step="any" value="100" oninput="updateConversion()"></div><div><label>原始币种</label><select id="convertCurrency" onchange="updateConversion()">${Object.keys(r.rates).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div></div><p id="convertResult" class="amount" aria-live="polite"></p></div><hr style="border:0;border-top:1px solid #edf0f5;margin:20px 0"><div class="actions"><button class="btn ghost" onclick="exportCsv()">导出本房间 CSV</button><button class="btn ${r.archived?'alt':'danger'}" onclick="toggleArchive()">${r.archived?'重新开启房间':'归档房间'}</button></div></div>`}
else{c.innerHTML=`<h2>操作历史</h2><div class="card">${r.logs.length?r.logs.map(l=>`<div class="item"><div>${esc(l.text)}</div><div class="small muted">${esc(l.at)}</div></div>`).join(''):'<div class="empty">暂无操作记录</div>'}</div>`}}
function updateConversion(){let r=room(),a=Number($('convertAmount')?.value),c=$('convertCurrency')?.value,rate=Number(r.rates[c]);if($('convertResult'))$('convertResult').textContent=Number.isFinite(a)&&a>=0&&Number.isFinite(rate)&&rate>0?`${a} ${c} × ${rate} = ${money(round(a*rate),r.base)}`:'请输入有效金额';}
function addMember(){openModal(`<h2>添加模拟成员</h2><label>成员昵称</label><input id="memberName" maxlength="30" placeholder="例如：小明"><p class="notice">仅用于本机测试，不会向朋友发送邀请。</p><button class="btn" onclick="confirmMember()">添加成员</button> <button class="btn ghost" onclick="closeModal()">取消</button>`)}function confirmMember(){let v=$('memberName').value.trim(),r=room();if(!v)return alert('请输入昵称');r.members.push({id:uid(),name:v});log(r,'添加成员 '+v);closeModal();save()}
function editExpense(id){let r=room(),e=r.expenses.find(x=>x.id===id),payer=e?.payer||r.members[0].id,selected=e?e.splits.map(s=>s.member):r.members.map(m=>m.id),currency=e?.currency||r.base;openModal(`<h2>${e?'编辑':'添加'}消费</h2><label>消费名称</label><input id="expenseTitle" value="${esc(e?.title||'')}" placeholder="例如：午餐"><label>消费类别</label><select id="expenseCategory">${CATEGORIES.map(c=>`<option value="${c}" ${(e?.category||'其他')===c?'selected':''}>${c}</option>`).join('')}</select><div class="grid"><div><label>金额</label><input id="expenseAmount" type="number" oninput="updateRateDisplay()" step="0.01" min="0.01" value="${e?.amount||''}"></div><div><label>币种</label><select id="expenseCurrency" onchange="updateRateDisplay()">${[...new Set([...Object.keys(r.rates),...(e&&!Object.hasOwn(r.rates,e.currency)?[e.currency]:[])])].map(c=>`<option ${c===currency?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="small muted" id="rateDisplay"></div><label>日期</label><input id="expenseDate" type="date" value="${esc(e?.date||today())}"><label>谁付款？</label><select id="expensePayer">${personOptions(r,payer)}</select><label>分摊方式</label><select id="splitMode" onchange="renderSplitInputs()"><option value="equal">均分</option><option value="custom" ${e?'selected':''}>自定义金额</option></select><div id="splitInputs"></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="confirmExpense('${id||''}')">保存消费</button><button class="btn ghost" onclick="closeModal()">取消</button></div>`);window.splitSelected=selected;window.editSplits=e?.splits||null;renderSplitInputs();updateRateDisplay()}
function updateRateDisplay(){let r=room(),c=$('expenseCurrency').value,amount=Number($('expenseAmount').value),rate=Number(r.rates[c]);$('rateDisplay').textContent=`汇率：1 ${c} = ${rate} ${r.base}`+(Number.isFinite(amount)&&amount>0?` · 约合 ${money(round(amount*rate),r.base)}`:'');}
function renderSplitInputs(){let r=room(),custom=$('splitMode').value==='custom';$('splitInputs').innerHTML=`<label>参与分摊的成员</label>${r.members.map(m=>`<div class="splitline"><label class="chip"><input type="checkbox" class="shareMember" value="${m.id}" ${window.splitSelected.includes(m.id)?'checked':''} onchange="syncSelected()">${esc(m.name)}</label>${custom?`<input type="number" class="shareAmount" data-member="${m.id}" step="0.01" min="0" value="${window.editSplits?.find(s=>s.member===m.id)?.amount??''}" placeholder="分摊金额">`:''}</div>`).join('')}<p class="muted small">${custom?'自定义分摊金额总和必须等于消费金额。':'所选成员均分，余数按最小货币单位分配。'}</p>`}
function syncSelected(){window.splitSelected=[...document.querySelectorAll('.shareMember:checked')].map(x=>x.value)}
function confirmExpense(id){let r=room(),title=$('expenseTitle').value.trim(),amount=n($('expenseAmount').value),currency=$('expenseCurrency').value,date=$('expenseDate').value,payer=$('expensePayer').value,selected=[...document.querySelectorAll('.shareMember:checked')].map(x=>x.value);if(!title||!Number.isFinite(amount)||amount<=0||!date||!selected.length)return alert('请填写有效名称、金额、日期并选择分摊成员');if(!Number.isInteger(Math.round(amount*100))||Math.abs(amount*100-Math.round(amount*100))>1e-7)return alert('金额最多保留两位小数');let splits=[];if($('splitMode').value==='custom'){splits=selected.map(m=>({member:m,amount:n(document.querySelector(`.shareAmount[data-member="${m}"]`).value)}));if(splits.some(s=>s.amount<0)||Math.abs(round(splits.reduce((a,s)=>a+s.amount,0))-amount)>0.001)return alert('分摊金额合计必须等于消费金额')}else{let cents=Math.round(amount*100),q=Math.floor(cents/selected.length),rem=cents%selected.length;splits=selected.map((m,i)=>({member:m,amount:(q+(i<rem?1:0))/100}))}let old=r.expenses.find(e=>e.id===id);if((!old||old.currency!==currency)&&(!Number.isFinite(Number(r.rates[currency]))||Number(r.rates[currency])<=0))return alert('请先在房间设置中添加该币种汇率');let obj={id:id||uid(),title,category:$('expenseCategory').value,amount,currency,rate:old?.currency===currency?old.rate:r.rates[currency],date,payer,splits};if(old)Object.assign(old,obj);else r.expenses.push(obj);log(r,(old?'编辑':'添加')+'消费：'+title);closeModal();save()}
function deleteExpense(id){let r=room(),e=r.expenses.find(x=>x.id===id);if(!confirm(`确定删除「${e.title}」吗？`))return;r.expenses=r.expenses.filter(x=>x.id!==id);log(r,'删除消费：'+e.title+'（金额 '+money(e.amount,e.currency)+'）');save()}
function addSettlement(){let r=room();if(r.members.length<2)return alert('至少需要两位成员');openModal(`<h2>记录实际还款</h2><label>谁转出？</label><select id="from">${personOptions(r,r.members[0].id)}</select><label>谁收到？</label><select id="to">${personOptions(r,r.members[1].id)}</select><label>还款金额（${r.base}）</label><input id="settlementAmount" type="number" step="0.01" min="0.01"><label>日期</label><input id="settlementDate" type="date" value="${today()}"><p class="muted small">这里只记录已经实际完成的转账，不会自动转钱。</p><button class="btn" onclick="confirmSettlement()">保存还款</button> <button class="btn ghost" onclick="closeModal()">取消</button>`)}
function confirmSettlement(){let r=room(),from=$('from').value,to=$('to').value,amount=n($('settlementAmount').value),date=$('settlementDate').value;if(from===to||amount<=0||!date||Math.abs(amount*100-Math.round(amount*100))>1e-7)return alert('请检查付款人、收款人、金额及日期');r.settlements.push({id:uid(),from,to,amount,date});log(r,'记录还款：'+money(amount,r.base));closeModal();save()}
function deleteSettlement(id){if(!confirm('确定撤销这笔还款记录？'))return;let r=room(),s=r.settlements.find(x=>x.id===id);r.settlements=r.settlements.filter(x=>x.id!==id);log(r,'撤销还款：'+money(s.amount,r.base));save()}
function renameRoom(){let r=room(),v=$('rename').value.trim();if(!v)return alert('请输入名称');r.name=v;log(r,'修改房间名称');save()}function addRate(){let r=room(),c=$('newCurrency').value.trim().toUpperCase(),rate=Number($('newRate').value);if(!/^[A-Z]{3}$/.test(c)||!Number.isFinite(rate)||rate<=0)return alert('请输入三位币种代码及正数汇率');if(c===r.base&&rate!==1)return alert('基准币种汇率必须为 1');r.rates[c]=rate;log(r,`设置汇率：1 ${c} = ${rate} ${r.base}`);save()}function editRate(c){let r=room();if(!r||r.archived||c===r.base||!Object.hasOwn(r.rates,c))return;let raw=prompt(`修改汇率：1 ${c} = 多少 ${r.base}？`,String(r.rates[c]));if(raw===null)return;let rate=Number(raw.trim());if(!raw.trim()||!Number.isFinite(rate)||rate<=0)return alert('请输入有效的正数汇率');r.rates[c]=rate;log(r,`修改汇率：1 ${c} = ${rate} ${r.base}`);save()}
function deleteRate(c){let r=room();if(!r||r.archived||c===r.base||!Object.hasOwn(r.rates,c))return;let count=r.expenses.filter(e=>e.currency===c).length;let msg=`确定删除 ${c} 的房间汇率吗？`+(count?`\n已有 ${count} 笔 ${c} 消费将保留原金额及历史汇率，仍会参与结算。`:'')+'\n删除后新消费将不能选择该币种。';if(!confirm(msg))return;delete r.rates[c];log(r,`删除汇率：${c}（历史账目保留）`);save()}
function toggleArchive(){let r=room();r.archived=!r.archived;log(r,r.archived?'归档房间':'重新开启房间');save()}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportBackup(){download('tripsplit-backup.json',JSON.stringify(state,null,2),'application/json')}function importBackup(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{let f=inp.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!x||typeof x.name!=='string'||!Array.isArray(x.rooms))throw Error('格式不正确');if(confirm('导入将覆盖当前本地数据，确定继续？')){state=x;save()}}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(f)};inp.click()}
function exportCsv(){let r=room(),rows=[['日期','消费','类别','付款人','原始金额','币种','汇率','折合'+r.base,'分摊详情'],...r.expenses.map(e=>[e.date,e.title,e.category||'其他',r.members.find(m=>m.id===e.payer)?.name||'',e.amount,e.currency,e.rate,round(e.amount*e.rate),e.splits.map(s=>(r.members.find(m=>m.id===s.member)?.name||'')+':'+s.amount).join('; ')])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('tripsplit-'+r.name.replace(/[^\w\u4e00-\u9fa5-]/g,'_')+'.csv',csv,'text/csv;charset=utf-8')}
render();if(state.name){state.active=null;refreshRooms().catch(e=>{console.error(e);render()})} 
</script></body></html>
